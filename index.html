<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>منصة أكاديمية بالقرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap">
<style>
/* Layout: sticky deep-green header with a scrollable tab rail; one centered working column of panels; lists turn into stacked cards on phones */
:root{
  --bg:#f4f4f0;--surface:#ffffff;--sunk:#e7eee9;--ink:#15302a;--muted:#566a63;--line:#d4dfd8;
  --hdr:#1c3825;--hdr-ink:#f6efe8;--hdr-muted:#cdb6a3;--tan:#d6a98a;
  --brand:#1f4a30;--brand-ink:#ffffff;--brand-soft:#e1ebe3;
  --gold:#9a5f3c;--gold-soft:#f5e6db;
  --ok:#25744a;--ok-soft:#d9eee1;--warn:#9b5800;--warn-soft:#fae6c9;--bad:#a8382a;--bad-soft:#f7ded8;
  --f-display:"Cairo","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1916;--surface:#15231f;--sunk:#1b2c27;--ink:#e4eee9;--muted:#93a9a0;--line:#293d36;
  --hdr:#142a1c;--hdr-ink:#f3ebe3;--hdr-muted:#bfa592;--tan:#d6a98a;
  --brand:#7cb88f;--brand-ink:#0d1a12;--brand-soft:#1c3424;
  --gold:#dcae8e;--gold-soft:#3a2a20;
  --ok:#6cc790;--ok-soft:#183427;--warn:#e9a94c;--warn-soft:#3a2a12;--bad:#ec8572;--bad-soft:#3d1f1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1916;--surface:#15231f;--sunk:#1b2c27;--ink:#e4eee9;--muted:#93a9a0;--line:#293d36;
  --hdr:#142a1c;--hdr-ink:#f3ebe3;--hdr-muted:#bfa592;--tan:#d6a98a;
  --brand:#7cb88f;--brand-ink:#0d1a12;--brand-soft:#1c3424;
  --gold:#dcae8e;--gold-soft:#3a2a20;
  --ok:#6cc790;--ok-soft:#183427;--warn:#e9a94c;--warn-soft:#3a2a12;--bad:#ec8572;--bad-soft:#3d1f1a;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 8px}
.hd h1{font-family:var(--f-display);font-weight:800;font-size:1.4rem;margin:0;line-height:1.35;text-wrap:balance}
.logo{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--tan)}
.hd .dates{font-size:.8rem;color:var(--hdr-muted)}
.hd .grow{flex:1;min-width:0}
.hf{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--hdr-muted)}
.hf select{background:transparent;color:var(--hdr-ink);border:1px solid color-mix(in srgb,var(--hdr-ink) 30%,transparent);border-radius:8px;padding:6px 10px}
.hf select option{color:#15302a;background:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--hdr-muted);padding:10px 14px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--hdr-ink);border-bottom-color:var(--tan)}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .grow{flex:1;min-width:0}
.count{font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 9px;font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--muted);font-size:.82rem}
.stat.alert b{color:var(--warn)}
.stat.bad b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:focus-visible,.row:focus-visible,.seg button:focus-visible,.mk button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1;min-width:160px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:0;border-color:var(--brand)}
textarea{min-height:120px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%}
.list > .row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.static{cursor:default}
.row.static:hover{background:none}
.nm{font-weight:600}
.sub{color:var(--muted);font-size:.82rem}
.row .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .full{grid-column:1 / -1}
.tag{display:inline-flex;align-items:center;font-size:.74rem;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.7}
.t-due{background:var(--warn-soft);color:var(--warn)}
.t-sch{background:var(--brand-soft);color:var(--brand)}
.t-ex{background:var(--sunk);color:var(--muted);border:1px dashed var(--muted)}
.t-k{background:var(--gold-soft);color:var(--gold)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-demo{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
.juz{position:relative;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;grid-column:1 / -1}
.juz b{position:absolute;inset-block:0;inset-inline-start:0;width:calc(var(--p) * 100%);background:var(--brand);border-radius:4px}
.juz.done b{background:var(--gold)}
.juz::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to left,transparent 0 calc(100% / 6 - 2px),var(--surface) calc(100% / 6 - 2px) calc(100% / 6))}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:10px;font-size:.9rem}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.88rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sunk);font-weight:600;color:var(--muted);font-size:.8rem}
tr:last-child td{border-bottom:0}
td.num{text-align:center}
.mk{display:inline-flex;gap:4px}
.mk button{width:42px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.mk button[aria-pressed="true"][data-m="p"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mk button[aria-pressed="true"][data-m="a"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mk button[aria-pressed="true"][data-m="e"]{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.mk button[aria-pressed="true"][data-m="t"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.teacher .admin-only{display:none!important}
.who{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--hdr-muted);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.who .btn{background:transparent;color:var(--hdr-ink);border-color:color-mix(in srgb,var(--hdr-ink) 35%,transparent)}
.who .btn:hover{background:color-mix(in srgb,var(--hdr-ink) 12%,transparent)}
.t-taj{background:var(--brand-soft);color:var(--brand)}
.batch{display:flex;flex-direction:column;gap:6px}
.batch h3{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:1rem}
.rep{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rep .nmcol{display:flex;flex-direction:column;min-width:0}
.rep.head{color:var(--muted);font-size:.8rem;border-top:0;padding-top:0}
@media (max-width:700px){
  .rep{grid-template-columns:1fr 1fr}
  .rep .nmcol{grid-column:1 / -1}
  .rep.head{display:none}
  .rep label.f span.lbl{display:block}
}
@media (min-width:701px){.rep label.f span.lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
#sheet{position:fixed;inset:0;z-index:20;background:rgb(10 20 17 / .45);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 40px)}
#sheet[hidden]{display:none}
.sh{background:var(--surface);width:min(640px,100%);max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:701px){#sheet{align-items:center;padding:40px}.sh{border-radius:16px}}
.shh{display:flex;align-items:center;gap:10px}
.shh h2{flex:1;min-width:0}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.foot .l{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:30;font-size:.9rem;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
.hint{font-size:.82rem;color:var(--muted)}
.lvl{display:flex;gap:10px;flex-wrap:wrap}
.lvl div{flex:1;min-width:110px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.lvl b{font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:block;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.teacher [data-act="newExam"],.teacher [data-act="newSard"],.teacher [data-act="addStudents"],.teacher [data-act="newHalaqa"],.teacher [data-act="saveName"],.teacher [data-act="demo"],.teacher [data-act="demoDel"],.teacher [data-act="clearExcuse"],.teacher [data-act="delStudent"],.teacher [data-act="delExam"],.teacher [data-act="delHalaqa"],.teacher [data-act="repApprove"],.teacher form[data-form] button[type=submit]{display:none!important}
.teacher form[data-form] :is(input,select,textarea){pointer-events:none;background:var(--sunk)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR=n=>Number(n||0).toLocaleString('ar-EG');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const thisMonth=()=>today().slice(0,7);
const addDays=(s,n)=>{const d=pISO(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStart=s=>{const d=pISO(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return iso(d)};
const fD=s=>s?new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short'}).format(pISO(s)):'';
const fDay=s=>new Intl.DateTimeFormat('ar-EG',{weekday:'short',day:'numeric',month:'short'}).format(pISO(s));
const fDY=s=>s?new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short',year:'numeric'}).format(pISO(s)):'';
const fM=m=>new Intl.DateTimeFormat('ar-EG',{month:'long',year:'numeric'}).format(pISO(m+'-01'));
const monthEnd=m=>{const d=pISO(m+'-01');d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d)};
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ar');

const KIND={five:'اختبار الخمسة',three:'اختبار الثلاثة',ten:'اختبار العشرة',twenty:'اختبار العشرين',khatma:'اختبار الختمة',tajweed:'اختبار التجويد'};

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- data layer ---------- */
const queues={};
function enqueue(k,fn){const p=(queues[k]||Promise.resolve()).then(fn,fn);queues[k]=p.catch(()=>{});return p}
function onErr(e){
  const c=e&&e.code;
  if(c==='permission-denied')toast('ليس لديكِ صلاحية لهذا الإجراء');
  else if(c==='resource-exhausted')toast('تجاوزنا الحد اليومي المجاني، حاولي غدًا أو تواصلي مع المسؤولة');
  else toast('لم يُحفظ التغيير، تحققي من الاتصال وأعيدي المحاولة');
}
const soon=ms=>new Promise(r=>setTimeout(r,ms));
function put(col,id,data){
  if(col==='exams'&&!data.halaqa){const st=S.students.get(data.student);if(st)data={...data,halaqa:st.halaqa}}
  const p=S.db.collection(col).doc(id).set(data);p.catch(onErr);
  return Promise.race([p,soon(1500)]);
}
function del(col,id){
  const p=S.db.collection(col).doc(id).delete();p.catch(onErr);
  return Promise.race([p,soon(1500)]);
}
function strip(o){const c={...o};delete c.id;return c}

/* ---------- derived ---------- */
let IDX={byStudent:new Map()};

const hName=id=>(S.halaqat.get(id)||{}).name||'بدون حلقة';
const halaqatArr=()=>[...S.halaqat.values()].sort(byName);
function studentsF(h,incl){h=h||S.hf;return [...S.students.values()].filter(s=>(h==='all'||s.halaqa===h)&&(incl||s.status!=='dismissed')).sort(byName)}
const lastH=(s,t)=>(s.history||[]).filter(x=>x.type===t).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
function excuseActive(s,on){on=on||today();const x=s.excuse;return x&&x.to&&x.to>=on&&(!x.from||x.from<=addDays(on,30))?x:null}
function excuseOn(s,d){const x=s.excuse;return x&&x.to&&x.to>=d&&(!x.from||x.from<=d)}
const STEPK={5:'five',3:'three',10:'ten',20:'twenty'},KSTEP={five:5,three:3,ten:10,twenty:20},SNAME={5:'الخمسة',3:'الثلاثة',10:'العشرة',20:'العشرين'};
function due(s,step){
  const juz=+s.juz||0,last=+s['last'+step]||0,next=last+step;
  if(juz<next)return null;
  const kind=STEPK[step];
  const sch=(IDX.byStudent.get(s.id)||[]).find(e=>e.kind===kind&&e.status==='scheduled'&&+e.milestone===next);
  return {next,sch,kind};
}
function khatmaState(s){
  if(s.khatmaDone)return {k:'ok',t:'خاتمة معتمدة'};
  const sch=(IDX.byStudent.get(s.id)||[]).find(e=>e.kind==='khatma'&&e.status==='scheduled');
  if(sch)return {k:'sch',t:'اختبار الختمة '+fD(sch.date),e:sch};
  return {k:'due',t:'بانتظار اختبار الختمة'};
}
const sardEvery=()=>+S.meta.sardEvery||21;
const dBetween=(a,b)=>Math.round((pISO(b)-pISO(a))/864e5);
function batchInfo(b){
  const ex=[...S.sard.values()].filter(x=>x.batch===b);
  const hist=ex.filter(x=>x.status!=='scheduled').sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  const sch=ex.filter(x=>x.status==='scheduled').sort((x,y)=>(x.date||'').localeCompare(y.date||''))[0]||null;
  const done=hist[0]||null;const next=done?addDays(done.date,sardEvery()):null;const left=next?dBetween(today(),next):null;
  const st=sch?'sch':(!done||left<=0)?'due':left<=3?'soon':'ok';
  return {b,done,hist,sch,next,left,st,rank:{due:0,soon:1,sch:2,ok:3}[st]};
}
function batchList(){
  const m=new Map();for(const s of studentsF())if((+s.juz||0)>=30&&s.batch)m.set(s.batch,(m.get(s.batch)||0)+1);
  return [...m].map(([b,n])=>({...batchInfo(b),n})).sort((a,b)=>a.rank-b.rank||(a.next||'').localeCompare(b.next||''));
}
function sardTag(x){
  if(x.st==='sch')return `<span class="tag t-sch">مجدول ${fD(x.sch.date)}</span>`;
  if(x.st==='due')return x.done&&x.left<0?`<span class="tag t-bad">متأخر ${AR(-x.left)} يومًا</span>`:`<span class="tag t-due">عليهن اختبار الآن</span>`;
  if(x.st==='soon')return `<span class="tag t-due">بعد ${AR(x.left)} أيام</span>`;
  return `<span class="tag t-ok">القادم ${fD(x.next)}</span>`;
}
const sardBtn=x=>`<button class="btn sm" data-act="${x.sch?'openSard':'newSard'}" data-id="${x.sch?x.sch.id:''}" data-b="${esc(x.b)}">${x.sch?'النتيجة':'تسجيل الاختبار'}</button>`;
function tally(from,to,h){
  const t=new Map();
  for(const a of S.att.values()){
    if(a.date<from||a.date>to)continue;if(h&&h!=='all'&&a.halaqa!==h)continue;
    for(const [sid,m] of Object.entries(a.marks||{})){const o=t.get(sid)||{p:0,a:0,e:0,t:0,ad:[]};if(m==='t'){o.p++;o.t++}else{o[m]=(o[m]||0)+1;if(m==='p'&&(a.taj||{})[sid])o.t++}if(m==='a')o.ad.push(a.date);t.set(sid,o)}
  }
  return t;
}

/* ---------- small renderers ---------- */
function tags(s,opt={}){
  let h='';
  if(s.status==='dismissed'){const l=lastH(s,'dismissed');return `<span class="tag t-bad">مفصولة${l?' منذ '+fDY(l.date):''}</span>`}
  if((s.history||[]).some(x=>x.type==='dismissed')){const r=lastH(s,'returned');h+=`<span class="tag t-ex">عادت بعد فصل${r?' · '+fD(r.date):''}</span>`}
  const x=excuseActive(s);if(x)h+=`<span class="tag t-ex" title="${esc(x.reason||'')}">بعذر${x.reason?' · '+esc(x.reason):''} حتى ${fD(x.to)}</span>`;
  if(!opt.no5){const d=due(s,5);if(d)h+=d.sch?`<span class="tag t-sch">الخمسة ${fD(d.sch.date)}</span>`:`<span class="tag t-due">عليها اختبار الخمسة</span>`;}
  if(!opt.no3){const d=due(s,3);if(d)h+=d.sch?`<span class="tag t-sch">الثلاثة ${fD(d.sch.date)}</span>`:`<span class="tag t-due">عليها اختبار الثلاثة</span>`;}
  for(const st of [10,20]){const d=due(s,st);if(d)h+=d.sch?`<span class="tag t-sch">${SNAME[st]} ${fD(d.sch.date)}</span>`:`<span class="tag t-due">عليها اختبار ${SNAME[st]}</span>`;}
  if((+s.juz||0)>=30)h+=`<span class="tag t-k">${s.khatmaDone?'خاتمة':'أتمّت الحفظ'}</span>`;
  if(s.demo)h+=`<span class="tag t-demo">تجريبي</span>`;
  return h;
}
const juzBar=s=>{const j=Math.max(0,Math.min(30,+s.juz||0));return `<div class="juz ${j>=30?'done':''}" style="--p:${j/30}" title="${AR(j)} من ٣٠ جزءًا"><b></b></div>`};
function stuRow(s,extra=''){
  return `<button class="row" data-act="openStudent" data-id="${s.id}">
    <div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(hName(s.halaqa))} · ${AR(s.juz)} جزءًا${s.tajweed?' · تجويد '+esc(s.tajweed):''}</div></div>
    <div class="tags">${tags(s)}${extra}</div>${juzBar(s)}</button>`;
}
const empty=t=>`<div class="empty">${t}</div>`;
const seg=(name,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="seg" data-k="${name}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const hOpts=(cur,all)=>(all?`<option value="all" ${cur==='all'?'selected':''}>كل الحلقات</option>`:'')+halaqatArr().map(h=>`<option value="${h.id}" ${cur===h.id?'selected':''}>${esc(h.name)}</option>`).join('');

function vKhatm(){
  const st=studentsF();
  const kh=st.filter(s=>(+s.juz||0)>=30);
  const near=st.filter(s=>(+s.juz||0)>=25&&(+s.juz||0)<30).sort((a,b)=>(+b.juz)-(+a.juz));

let pending=false,raf=0;
function schedule(){
  reindex();
  const a=document.activeElement;
  if(a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='button'){pending=true;renderHeader();return}

function render(){

async function markAtt(sid,m){
  const key=S.attH+'_'+S.attDate;const cur=S.att.get(key);const marks={...(cur?.marks||{})};const taj={...(cur?.taj||{})};
  if(marks[sid]==='t'){marks[sid]='p';taj[sid]=true}
  if(m==='t'){if(taj[sid])delete taj[sid];else{taj[sid]=true;if(marks[sid]!=='p')marks[sid]='p'}}
  else if(marks[sid]===m){delete marks[sid];delete taj[sid]}
  else{marks[sid]=m;if(m!=='p')delete taj[sid]}
  const data={halaqa:S.attH,date:S.attDate,marks,taj};if(cur?.demo)data.demo=true;
  try{await put('attendance',key,data)}catch(e){}
  if(!S.db)return;schedule();
}

async function saveReport(submit,approve){
  const h=S.repH,m=S.repMonth,key=h+'_'+m;const d=repDraft(h,m);
  const note=$('#repNote');if(note)d.note=note.value;
  const data={...d,halaqa:h,month:m,submitted:submit||!!(S.monthly.get(key)||{}).submitted,updatedAt:new Date().toISOString()};
  if(submit){data.submittedAt=new Date().toISOString();data.applied=!!approve}
  if(!S.admin)data.applied=false;
  if(S.halaqat.get(h)?.demo)data.demo=true;
  try{await put('monthly',key,data)}catch(e){return}
  if(approve){
    const jobs=[];
    for(const [sid,r] of Object.entries(d.rows||{})){
      const s=S.students.get(sid);if(!s)continue;const upd={};
      if(r.juz!==''&&r.juz!=null&&num(r.juz)>(+s.juz||0))upd.juz=num(r.juz);
      if(r.tajweed&&r.tajweed!==s.tajweed)upd.tajweed=r.tajweed;
      if(Object.keys(upd).length)jobs.push(put('students',sid,{...strip(s),...upd}).catch(()=>{}));
    }
    await Promise.all(jobs);
  }
  delete S.drafts[key];toast(approve?'اعتُمد التقرير وتحدّثت الملفات':submit?'سُلِّم التقرير للإدارة':'حُفظت المسودة');schedule();
}

const unsubs=[];
function listen(key,refs){
  const parts=refs.map(()=>null);let done=0;S.loaded[key]=refs.length===0;
  if(!refs.length){S[key]=new Map();return}
  refs.forEach((ref,ix)=>{
    unsubs.push(ref.onSnapshot(snap=>{
      parts[ix]=snap.docs?snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]):(snap.exists?[[snap.id,{...snap.data(),id:snap.id}]]:[]);
      if(!S.loaded[key]&&parts.every(p=>p))S.loaded[key]=true;
      S[key]=new Map(parts.filter(Boolean).flat());schedule();
    },err=>{parts[ix]=parts[ix]||[];if(parts.every(p=>p))S.loaded[key]=true;console.warn(key,err&&err.code);schedule()}));
  });
}
async function syncAccess(){
  if(!S.admin)return;
  const map={};for(const h of S.halaqat.values())for(const e of (h.teachers||[]))(map[e]=map[e]||[]).includes(h.id)||map[e].push(h.id);
  const ops=[];
  for(const [e,hs] of Object.entries(map)){const cur=S.access.get(e);const a=JSON.stringify([...hs].sort()),b=JSON.stringify([...((cur&&cur.halaqat)||[])].sort());if(a!==b)ops.push(()=>fdb.collection('access').doc(e).set({halaqat:hs}))}
  for(const e of S.access.keys())if(!map[e])ops.push(()=>fdb.collection('access').doc(e).delete());
  await pool(ops);
}
